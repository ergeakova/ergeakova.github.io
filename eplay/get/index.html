<script>
  // Cihaza gore store'a otomatik yonlendir (mobil).
  (function () {
    var IOS_URL  = "https://apps.apple.com/tr/app/eplay-iptv-player/id1644601132";
    var PLAY_URL = "https://play.google.com/store/apps/details?id=com.ergeakova.Eplay&hl=tr";
    var ua = navigator.userAgent || navigator.vendor || "";
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS
    var isAndroid = /android/i.test(ua);
    if (isIOS)        location.replace(IOS_URL);
    else if (isAndroid) location.replace(PLAY_URL);
    // masaustu / bilinmeyen: asagidaki secim ekrani gosterilir
  })();

<style>
  :root {
    --bg:#08080a; --border:rgba(255,255,255,.08); --text:#f5f5f7;
    --text-dim:rgba(245,245,247,.62); --accent:#7c6cff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",sans-serif;
    background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(124,108,255,.12),transparent 70%),var(--bg);
    color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; -webkit-font-smoothing:antialiased; text-align:center;
  }
  .card { max-width:400px; width:100%; }
  .icon { width:104px; height:104px; border-radius:23%; box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12); }
  h1 { margin-top:22px; font-size:30px; font-weight:700; letter-spacing:-.03em; }
  p  { margin-top:10px; color:var(--text-dim); font-size:15.5px; }
  .btns { margin-top:28px; display:flex; flex-direction:column; gap:12px; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    padding:14px 20px; border-radius:14px; font-size:15px; font-weight:600;
    text-decoration:none; color:var(--text);
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    transition:transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .btn:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.08); }
  .btn svg { width:20px; height:20px; fill:currentColor; }
  .back { display:inline-block; margin-top:26px; color:var(--text-dim); text-decoration:none; font-size:14px; }
  .back:hover { color:var(--text); }
</style>
